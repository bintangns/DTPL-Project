{% extends "adminpanel/base.html" %}
{% block title %}Hapus Paket — Admin{% endblock %}
{% block content %}
<div class="page-header"><h1>Hapus Paket Wisata</h1></div>
<div class="content-card" style="max-width:600px;">
    <p style="margin-bottom:20px;">Apakah Anda yakin ingin menghapus paket <strong>{{ package.name }}</strong>?</p>
    <form method="POST">
        {% csrf_token %}
        <div style="display:flex;gap:12px;">
            <button type="submit" class="btn-danger">Ya, Hapus</button>
            <a href="{% url 'guide_admin:package_list' %}" class="btn-secondary">Batal</a>
        </div>
    </form>
</div>
{% endblock %}
