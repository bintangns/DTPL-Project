{# dashboard/templates/dashboard/analytics/_styles.html #}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  :root {
    --primary: #2563eb;
    --success: #16a34a;
    --success-light: #dcfce7;
    --warning: #f59e0b;
    --danger: #dc2626;
    --gray-bg: #f8fafc;
    --border: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --text-light: #94a3b8;
    --card-radius: 16px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.07);
  }

  * { box-sizing: border-box; }

  .analytics-wrap {
    font-family: 'Plus Jakarta Sans', sans-serif;
    padding: 24px;
    background: #f8fafc;
    min-height: 100vh;
  }

  /* ── Header ── */
  .dash-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .dash-header h1 {
    font-size: 1.75rem;
    font-weight: 800;
    color: var(--text-main);
    margin: 0 0 4px;
    letter-spacing: -0.5px;
  }
  .dash-header p {
    color: var(--text-muted);
    font-size: 0.875rem;
    margin: 0;
  }
  .export-group {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .btn-export {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text-main);
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn-export:hover {
    background: #f1f5f9;
    border-color: #cbd5e1;
    box-shadow: var(--shadow-md);
  }
  .btn-export i { font-size: 0.9rem; }

  /* ── Period Selector ── */
  .period-bar {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
    flex-wrap: wrap;
  }
  .period-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-muted);
  }
  .period-label i { color: var(--text-muted); }
  .period-btns {
    display: flex;
    gap: 6px;
    margin-left: auto;
  }
  .btn-period {
    padding: 7px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
    color: #475569;
    font-family: inherit;
  }
  .btn-period:hover { background: #f1f5f9; }
  .btn-period.active {
    background: #0f172a;
    color: #fff;
    border-color: #0f172a;
    box-shadow: 0 2px 8px rgba(15,23,42,0.2);
  }

  /* ── KPI Grid ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .kpi-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 20px 22px 18px;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    transition: box-shadow 0.15s;
  }
  .kpi-card:hover { box-shadow: var(--shadow-md); }
  .kpi-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .kpi-name {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .kpi-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
  }
  .kpi-icon.blue  { background: #eff6ff; color: #2563eb; }
  .kpi-icon.green { background: #f0fdf4; color: #16a34a; }
  .kpi-icon.amber { background: #fffbeb; color: #d97706; }
  .kpi-icon.rose  { background: #fff1f2; color: #e11d48; }
  .kpi-value {
    font-size: 1.75rem;
    font-weight: 800;
    color: var(--text-main);
    letter-spacing: -0.5px;
    margin-bottom: 4px;
    line-height: 1.1;
  }
  .kpi-sub {
    font-size: 0.75rem;
    color: var(--text-light);
    margin-bottom: 12px;
  }
  .kpi-growth {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.78rem;
    font-weight: 700;
    color: #16a34a;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    padding: 3px 8px;
    border-radius: 6px;
  }
  .kpi-growth i { font-size: 0.7rem; }
  .kpi-growth .from {
    color: var(--text-light);
    font-weight: 400;
    margin-left: 2px;
  }

  /* ── Target KPI Section ── */
  .target-section {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 24px 28px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
  }
  .target-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .target-head .icon-circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #22c55e;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 0.75rem;
    flex-shrink: 0;
  }
  .target-head h3 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-main);
    margin: 0;
  }
  .target-desc {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin: 0 0 22px 38px;
  }
  .target-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
    margin-bottom: 20px;
  }
  .prog-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .prog-name {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-main);
  }
  .badge-done {
    background: #0f172a;
    color: #fff;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .prog-bar-bg {
    background: #f1f5f9;
    height: 8px;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .prog-fill {
    width: var(--progress-width, 0%);
    height: 100%;
    border-radius: 10px;
    background: #0f172a;
    transition: width 1s ease;
  }
  .prog-bottom {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--text-light);
  }
  .prog-pct { font-weight: 700; color: var(--text-muted); }

  /* ── Info Alert ── */
  .info-alert {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    color: #14532d;
    font-size: 0.85rem;
  }
  .info-alert i {
    color: #16a34a;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .info-alert strong { font-weight: 700; }

  /* ── Tabs ── */
  .tab-bar {
    display: flex;
    gap: 0;
    border-bottom: 2px solid var(--border);
    margin-bottom: 24px;
  }
  .tab-btn {
    padding: 10px 20px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
    background: none;
    border: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: all 0.15s;
    font-family: inherit;
    white-space: nowrap;
  }
  .tab-btn:hover { color: var(--text-main); }
  .tab-btn.active {
    color: var(--text-main);
    border-bottom-color: var(--text-main);
  }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* ── Cards ── */
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 22px 24px;
    box-shadow: var(--shadow-sm);
  }
  .card-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-main);
    margin: 0 0 4px;
  }
  .card-sub {
    font-size: 0.78rem;
    color: var(--text-light);
    margin: 0 0 20px;
  }

  /* ── Grid layouts ── */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  /* ── Tables ── */
  .tbl {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.84rem;
  }
  .tbl th {
    text-align: left;
    padding: 10px 12px;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .tbl td {
    padding: 11px 12px;
    border-bottom: 1px solid #f8fafc;
    color: var(--text-main);
  }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tr:hover td { background: #fafbfc; }
  .occ-badge {
    background: #0f172a;
    color: #fff;
    padding: 3px 9px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    display: inline-block;
    min-width: 42px;
    text-align: center;
  }
  .prod-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.72rem;
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 600;
    margin-left: 6px;
  }
  .rank-num {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 800;
    flex-shrink: 0;
  }
  .rank-1 { background: #fef9c3; color: #713f12; }
  .rank-2 { background: #f1f5f9; color: #475569; }
  .rank-3 { background: #fef3c7; color: #92400e; }
  .rank-4 { background: #f0fdf4; color: #166534; }
  .rank-5 { background: #eff6ff; color: #1e40af; }

  /* ── Bottom Stats Grid ── */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-top: 24px;
  }
  .stat-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 20px 22px;
    text-align: center;
    box-shadow: var(--shadow-sm);
  }
  .stat-label {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 10px;
  }
  .stat-value {
    font-size: 1.7rem;
    font-weight: 800;
    color: var(--text-main);
    letter-spacing: -0.5px;
  }
  .stat-hint {
    font-size: 0.74rem;
    color: var(--text-light);
    margin-top: 4px;
  }

  /* ── Destinasi Populer ── */
  .dest-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .dest-rank-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #f1f5f9;
  }
  .dest-rank-item:last-child { border-bottom: none; }
  .dest-name {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-main);
    flex: 1;
  }
  .dest-cnt {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .dest-bar-wrap {
    height: 4px;
    background: #f1f5f9;
    border-radius: 10px;
    margin-top: 6px;
    overflow: hidden;
  }
  .dest-bar { height: 100%; border-radius: 10px; }

  /* ── MoM Comparison ── */
  .mom-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-top: 20px;
  }
  .mom-item { text-align: center; }
  .mom-metric { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
  .mom-val {
    font-size: 1.4rem;
    font-weight: 800;
    color: #16a34a;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .mom-val i { font-size: 0.9rem; }

  /* ── Responsive ── */
  @media (max-width: 1024px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .target-grid { grid-template-columns: 1fr; gap: 16px; }
    .grid-2, .dest-wrap { grid-template-columns: 1fr; }
    .mom-stats { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .kpi-grid { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: 1fr; }
    .period-btns { margin-left: 0; }
    .dash-header { flex-direction: column; }
    .analytics-wrap { padding: 16px; }
  }
</style>
